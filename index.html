<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hub</title>
<style>
  :root { --bg:#0e0f12; --card:#181a20; --line:#2a2d36; --fg:#e8e6e1; --dim:#8b8f99; --acc:#7fb4ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:.04em; }
  .lead { color:var(--dim); margin:0 0 24px; font-size:14px; }
  .list { display:grid; gap:10px; }
  a.item, div.item { display:block; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; }
  a.item:active { background:#20232b; }
  .nm { font-size:18px; font-weight:600; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .soon { opacity:.5; }
  .empty { color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>hub</h1>
  <p class="lead">いろいろ置き場</p>
  <div class="list" id="list"></div>
</main>
<script>
/* Home-screen apps keep an old copy; load the newest one when its VERSION differs. Bump VERSION on every change. */
const VERSION = "2026-11-25.2";
async function checkUpdate() {
  try {
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const VERSION = "([^"]+)"/);
    if (!m || m[1] === VERSION || sessionStorage.getItem("reloaded-" + m[1])) return;
    sessionStorage.setItem("reloaded-" + m[1], "1");
    location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
  } catch (e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });

/* Add a page: put its folder next to this file (e.g. vr/index.html) and one line here.
   soon: true shows it greyed out without a link. */
const ITEMS = [
  { path: "vr/", name: "VR　夜の川辺", sub: "ダンボールゴーグルで見回す、雪の降る夜の川（iPhone を横向きに）" },
];

const list = document.getElementById("list");
if (!ITEMS.length) list.innerHTML = '<p class="empty">まだ何もありません</p>';
for (const it of ITEMS) {
  const el = document.createElement(it.soon ? "div" : "a");
  el.className = "item" + (it.soon ? " soon" : "");
  if (!it.soon) el.href = it.path;
  el.innerHTML = '<div class="nm"></div><div class="sub"></div>';
  el.querySelector(".nm").textContent = it.name;
  el.querySelector(".sub").textContent = it.sub || "";
  list.appendChild(el);
}
</script>
</body>
</html>
