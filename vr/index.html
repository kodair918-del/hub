<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>VR</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; image-rendering:pixelated; image-rendering:crisp-edges; }
  #panel { position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(560px, 100vw); max-height:100dvh; overflow:auto; background:rgba(14,15,18,.9); color:#e8e6e1; font-family:system-ui, -apple-system, "Hiragino Sans", sans-serif; padding:12px 16px 14px; border-radius:16px 16px 0 0; box-sizing:border-box; }
  #panel.off { display:none; }
  #panel b { font-size:17px; }
  #panel .s { font-size:12px; color:#9aa0ab; line-height:1.6; margin:4px 0 8px; }
  .row { display:grid; grid-template-columns:7.5em 1fr 3.6em; align-items:center; gap:8px; font-size:13px; margin:4px 0; }
  .row input { width:100%; }
  .row span:last-child { text-align:right; color:#9aa0ab; font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .btns div { flex:1; text-align:center; padding:11px 0; border-radius:12px; font-weight:bold; font-size:15px; }
  #go { background:#7fb4ff; color:#0b0b0a; }
  #reset { background:#252832; flex:0 0 7em !important; font-weight:normal !important; }
  .modes { display:flex; gap:6px; margin:6px 0 8px; }
  .modes div { flex:1; text-align:center; padding:8px 0; border-radius:10px; background:#252832; font-size:13px; }
  .modes div.on { background:#7fb4ff; color:#0b0b0a; font-weight:bold; }
  #camrow { display:none; }
  #camrow.on { display:grid; }
  video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="vid" playsinline muted autoplay></video>
<div id="panel">
  <b>夜の川辺</b>
  <div class="s">横向きにしてゴーグルに入れると、首の動きで見回せます。左右の丸がそれぞれのレンズの真ん中に来るように合わせてください。<br>ゴーグルの中で：画面を1回タップ → この調整に戻る／2回タップ → いま向いている方が正面</div>
  <div class="modes" id="modes"><div data-m="scene">夜の川辺</div><div data-m="cam">カメラ</div><div data-m="camsnow">カメラ＋雪</div></div>
  <div class="row" id="camrow"><span>カメラの大きさ</span><input id="zoom" type="range" min="0.6" max="1.6" step="0.02"><span id="zoomv"></span></div>
  <div class="row"><span>レンズの間隔</span><input id="sep" type="range" min="50" max="75" step="0.5"><span id="sepv"></span></div>
  <div class="row"><span>上下の位置</span><input id="vy" type="range" min="-15" max="15" step="0.5"><span id="vyv"></span></div>
  <div class="row"><span>ゆがみ補正</span><input id="k" type="range" min="0" max="2" step="0.05"><span id="kv"></span></div>
  <div class="row"><span>見える広さ</span><input id="dist" type="range" min="30" max="50" step="0.5"><span id="distv"></span></div>
  <div class="btns"><div id="reset">元に戻す</div><div id="go">はじめる</div></div>
  <div class="s" id="note"></div>
</div>
<script>
"use strict";
/* ---------- settings (tunable) ---------- */
const EYE_H = 200;          // canvas height in pixels (lower = chunkier pixels, faster)
const PX_PER_MM = 6.04;     // CSS pixels per millimetre on the phone screen (recent iPhones: 460 ppi / 3)
const IPD = 0.064;          // distance between the eyes in the scene, metres (depth of the snow)
const EYE_HEIGHT = 1.6;     // how high the eyes are above the snow
const SNOW_N = 450;         // snowflakes
const K1 = 0.34, K2 = 0.55; // lens distortion (Cardboard's usual values), scaled by the "ゆがみ補正" slider
const MAX_TAN = 1.25;       // beyond this angle from the lens centre, draw black
// the viewer: lens spacing (mm), lens centre up/down from the screen middle (mm), distortion scale, screen-to-lens distance (mm)
// zoom: camera picture size (1 = true size, as the iPhone's 1x camera sees it); mode: scene | cam | camsnow
const DEFAULTS = { sep: 60, vy: 0, k: 1, dist: 39, zoom: 1, mode: "scene" };
const CAM_TAN_H = Math.tan(34 * Math.PI / 180);   // half of the 1x camera's horizontal view (about 68 deg across)
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem("vrcfg") || "{}")); } catch (e) {}
function save() { try { localStorage.setItem("vrcfg", JSON.stringify(S)); } catch (e) {} }

/* ---------- small math ---------- */
const PI = Math.PI;
function qMul(a, b) {
  return [a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
          a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
          a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
          a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
}
function qAxis(x, y, z, ang) { const s = Math.sin(ang/2); return [x*s, y*s, z*s, Math.cos(ang/2)]; }
function qRot(q, x, y, z) {
  const [qx, qy, qz, qw] = q;
  const ix = qw*x + qy*z - qz*y, iy = qw*y + qz*x - qx*z, iz = qw*z + qx*y - qy*x, iw = -qx*x - qy*y - qz*z;
  return [ix*qw + iw*-qx + iy*-qz - iz*-qy, iy*qw + iw*-qy + iz*-qx - ix*-qz, iz*qw + iw*-qz + ix*-qy - iy*-qx];
}
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ---------- head orientation ---------- */
let devQ = null, hasGyro = false;
let recenter = [0, 0, 0, 1];
let dragYaw = 0, dragPitch = 0;
const Q_BACK = [-Math.SQRT1_2, 0, 0, Math.SQRT1_2];   // -90 deg about X: the camera looks out of the back of the phone
function onOrient(e) {
  if (e.alpha == null) return;
  hasGyro = true;
  const d = PI / 180, x = e.beta * d, y = e.alpha * d, z = -e.gamma * d;
  const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2), s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
  let q = [s1*c2*c3 + c1*s2*s3, c1*s2*c3 - s1*c2*s3, c1*c2*s3 - s1*s2*c3, c1*c2*c3 + s1*s2*s3];   // Euler YXZ
  q = qMul(q, Q_BACK);
  const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * d;
  devQ = qMul(q, qAxis(0, 0, 1, -ang));
}
function headQ() {
  if (hasGyro && devQ) return qMul(recenter, devQ);
  return qMul(qAxis(0, 1, 0, dragYaw), qAxis(1, 0, 0, dragPitch));
}
function doRecenter() {
  if (!devQ) { dragYaw = 0; dragPitch = 0; return; }
  const f = qRot(devQ, 0, 0, -1);
  recenter = qAxis(0, 1, 0, -Math.atan2(-f[0], -f[2]));
}

/* ---------- the scene: night sky, mountains, a river in the snow ---------- */
const MOON = (() => { const v = [0.45, 0.42, -0.79], l = Math.hypot(...v); return v.map(a => a / l); })();
const MOON_COS = Math.cos(2.4 * PI / 180), GLOW_COS = Math.cos(9 * PI / 180);
const DEG = PI / 180;
function farH(az) { return (6.5 + 3 * Math.sin(3*az + 1) + 2 * Math.sin(7*az + 2) + 0.8 * Math.sin(17*az)) * DEG; }
function nearH(az) { return (2.8 + 2.2 * Math.sin(5*az + 4) + 1.3 * Math.sin(11*az + 1) + 0.5 * Math.sin(29*az)) * DEG; }

let T = 0;
function sky(dx, dy, dz, out) {
  const el = Math.asin(Math.max(-1, Math.min(1, dy)));
  const az = Math.atan2(dx, -dz);
  const hn = nearH(az);
  if (el < hn) {
    if (el < 0) { out[0] = 20; out[1] = 26; out[2] = 48; return; }
    out[0] = 13; out[1] = 17; out[2] = 30; return;
  }
  const hf = farH(az);
  if (el < hf) {
    if (hf > 9 * DEG && el > hf - 1.3 * DEG) { out[0] = 120; out[1] = 132; out[2] = 165; return; }
    out[0] = 26; out[1] = 32; out[2] = 56; return;
  }
  const k = Math.min(1, Math.max(0, el / (PI / 2)));
  let r = 24 - 18 * k, g = 32 - 24 * k, b = 64 - 40 * k;
  const m = dx * MOON[0] + dy * MOON[1] + dz * MOON[2];
  if (m > MOON_COS) { out[0] = 236; out[1] = 230; out[2] = 196; return; }
  if (m > GLOW_COS) { const gl = (m - GLOW_COS) / (MOON_COS - GLOW_COS); r += 40 * gl * gl; g += 40 * gl * gl; b += 46 * gl * gl; }
  const N = 150, ix = Math.floor((dx + 1) * N), iy = Math.floor((dy + 1) * N), iz = Math.floor((dz + 1) * N);
  const h = hash3(ix, iy, iz);
  if (h < 0.012 + 0.01 * k) {
    const ph = hash3(iz, ix, iy) * 6.283, br = 0.55 + 0.45 * Math.sin(T * (1 + h * 160) + ph);
    const s = (140 + 115 * hash3(iy, iz, ix)) * br;
    r = Math.max(r, s); g = Math.max(g, s); b = Math.max(b, s * 1.05);
  }
  out[0] = r; out[1] = g; out[2] = b;
}

function riverZ(x) { return -9 + 2.2 * Math.sin(x * 0.045 + 0.6) + 0.8 * Math.sin(x * 0.13); }
const RIVER_HALF = 2.6;
const tmp = [0, 0, 0];
function shade(ex, ey, ez, dx, dy, dz, out) {
  if (dy >= -0.002) { sky(dx, dy, dz, out); return; }
  const t = (ey + EYE_HEIGHT) / -dy;
  const px = ex + dx * t, pz = ez + dz * t;
  const fog = 1 - Math.exp(-t / 70);
  const zc = riverZ(px), dist = Math.abs(pz - zc);
  let r, g, b;
  if (dist < RIVER_HALF) {
    const wob = 0.018 * Math.sin(px * 1.7 + T * 1.6) + 0.012 * Math.sin(pz * 2.3 - T * 1.1);
    sky(dx + wob, -dy, dz, tmp);
    r = tmp[0] * 0.55 + 4; g = tmp[1] * 0.6 + 8; b = tmp[2] * 0.7 + 16;
    const gl = hash3(Math.floor(px * 3 - T * 4), Math.floor(pz * 6), 7);
    if (gl > 0.985) { r += 40; g += 46; b += 60; }
  } else if (dist < RIVER_HALF + 0.35) {
    r = 30; g = 34; b = 44;
  } else {
    const n = (hash3(Math.floor(px * 2), Math.floor(pz * 2), 3) - 0.5) * 14;
    r = 118 + n; g = 128 + n; b = 158 + n;
  }
  out[0] = r + (20 - r) * fog; out[1] = g + (26 - g) * fog; out[2] = b + (48 - b) * fog;
}

/* ---------- snow ---------- */
const flakes = [];
function rnd(a, b) { return a + Math.random() * (b - a); }
for (let i = 0; i < SNOW_N; i++) flakes.push({ x: rnd(-14, 14), y: rnd(-EYE_HEIGHT, 9), z: rnd(-14, 14), v: rnd(0.5, 1.1), p: rnd(0, 6.28) });
function stepSnow(dt) {
  for (const f of flakes) {
    f.y -= f.v * dt;
    f.x += Math.sin(T * 0.7 + f.p) * 0.25 * dt;
    if (f.y < -EYE_HEIGHT) { f.y = 9; f.x = rnd(-14, 14); f.z = rnd(-14, 14); }
  }
}

/* ---------- the lenses: which way each screen pixel looks ----------
   Each pixel's place on the screen (in mm) is measured from its lens centre. The lens bends it outward
   (r_screen = r * (1 + k1 r^2 + k2 r^4)), so we undo that to find the true angle and draw what lies there.
   Through the lens the picture then looks straight again and the right size. */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0, img = null, px32 = null, lutU = null, lutV = null, lutS = null;
let mmW = 0, mmH = 0, lensX = [0, 0], lensY = 0, k1 = K1, k2 = K2;
function undistort(rs) {           // screen tan-radius -> true tan-radius (Newton)
  let r = rs;
  for (let n = 0; n < 8; n++) {
    const r2 = r * r, f = r * (1 + k1 * r2 + k2 * r2 * r2) - rs, d = 1 + 3 * k1 * r2 + 5 * k2 * r2 * r2;
    r -= f / d;
  }
  return r;
}
function build() {
  H = EYE_H; W = Math.max(80, Math.round(H * innerWidth / innerHeight));
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H);
  px32 = new Uint32Array(img.data.buffer);
  lutU = new Float32Array(W * H); lutV = new Float32Array(W * H); lutS = new Int8Array(W * H);
  mmW = innerWidth / PX_PER_MM; mmH = innerHeight / PX_PER_MM;
  lensX = [mmW / 2 - S.sep / 2, mmW / 2 + S.sep / 2]; lensY = mmH / 2 - S.vy;
  k1 = K1 * S.k; k2 = K2 * S.k;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const k = j * W + i;
    const xm = (i + 0.5) / W * mmW, ym = (j + 0.5) / H * mmH;
    const side = xm < mmW / 2 ? 0 : 1;
    const tx = (xm - lensX[side]) / S.dist, ty = (lensY - ym) / S.dist;
    const rs = Math.hypot(tx, ty);
    const ru = rs > 0 ? undistort(rs) : 0;
    if (ru > MAX_TAN || !(ru >= 0)) { lutS[k] = 0; continue; }
    const s = rs > 0 ? ru / rs : 1;
    lutU[k] = tx * s; lutV[k] = ty * s; lutS[k] = side === 0 ? -1 : 1;
  }
}
// true tan-angles (tx, ty) for one eye -> canvas pixel, or -1
function toPixel(side, tx, ty) {
  const r2 = tx * tx + ty * ty, f = 1 + k1 * r2 + k2 * r2 * r2;
  const xm = lensX[side < 0 ? 0 : 1] + tx * f * S.dist, ym = lensY - ty * f * S.dist;
  const i = Math.floor(xm / mmW * W), j = Math.floor(ym / mmH * H);
  if (i < 0 || i >= W || j < 0 || j >= H) return -1;
  const k = j * W + i;
  return lutS[k] === side ? k : -1;
}
addEventListener("resize", build);
build();

/* ---------- the camera: one picture, shown to both eyes through the same lens correction ---------- */
const vid = document.getElementById("vid");
const camCv = document.createElement("canvas"), camCtx = camCv.getContext("2d", { willReadFrequently: true });
let camOn = false, camLut = null, camKey = "", camW = 0, camH = 0;
async function startCam() {
  if (camOn) return true;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    vid.srcObject = st; await vid.play(); camOn = true; return true;
  } catch (e) {
    document.getElementById("note").textContent = "カメラが使えませんでした（" + (e.name || e) + "）。設定 → Safari → カメラ を「許可」にしてください。";
    return false;
  }
}
function stopCam() {
  if (!camOn) return;
  for (const t of vid.srcObject.getTracks()) t.stop();
  vid.srcObject = null; camOn = false;
}
// which camera pixel each screen pixel shows (-1 = outside the picture)
function camTable() {
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw || !vh) return false;
  const sc = Math.min(1, 320 / vw);            // read a small copy: chunky pixels, and fast
  camW = Math.round(vw * sc); camH = Math.round(vh * sc);
  const key = camW + "x" + camH + "|" + W + "x" + H + "|" + S.zoom + "|" + S.sep + "|" + S.vy + "|" + S.k + "|" + S.dist;
  if (key === camKey) return true;
  camKey = key; camCv.width = camW; camCv.height = camH;
  const th = CAM_TAN_H / S.zoom, tv = th * vh / vw;
  camLut = new Int32Array(W * H);
  for (let k = 0; k < W * H; k++) {
    if (lutS[k] === 0) { camLut[k] = -1; continue; }
    const x = 0.5 + lutU[k] / (2 * th), y = 0.5 - lutV[k] / (2 * tv);
    camLut[k] = x < 0 || x >= 1 || y < 0 || y >= 1 ? -1 : Math.floor(y * camH) * camW + Math.floor(x * camW);
  }
  return true;
}
function renderCam() {
  if (!camOn || vid.readyState < 2 || !camTable()) { px32.fill(0xff000000); return; }
  camCtx.drawImage(vid, 0, 0, camW, camH);
  const src = new Uint32Array(camCtx.getImageData(0, 0, camW, camH).data.buffer);
  const n = W * H;
  for (let k = 0; k < n; k++) { const c = camLut[k]; px32[k] = c < 0 ? 0xff000000 : src[c]; }
}

const col = [0, 0, 0];
function render(q) {
  const R = qRot(q, 1, 0, 0), U = qRot(q, 0, 1, 0), F = qRot(q, 0, 0, -1);
  const o = IPD / 2;
  const eL = [-R[0] * o, -R[1] * o, -R[2] * o], eR = [R[0] * o, R[1] * o, R[2] * o];
  const n = W * H;
  if (S.mode !== "scene") renderCam();
  for (let k = 0; k < n && S.mode === "scene"; k++) {
    const s = lutS[k];
    if (s === 0) { px32[k] = 0xff000000; continue; }
    const u = lutU[k], v = lutV[k], e = s < 0 ? eL : eR;
    let dx = F[0] + R[0] * u + U[0] * v, dy = F[1] + R[1] * u + U[1] * v, dz = F[2] + R[2] * u + U[2] * v;
    const l = 1 / Math.sqrt(dx*dx + dy*dy + dz*dz); dx *= l; dy *= l; dz *= l;
    shade(e[0], e[1], e[2], dx, dy, dz, col);
    px32[k] = 0xff000000 | (Math.min(255, col[2]) << 16) | (Math.min(255, col[1]) << 8) | Math.min(255, col[0]);
  }
  // snowflakes for each eye (near ones bigger, shifted between the eyes = depth)
  if (S.mode === "cam") return;
  for (const side of [-1, 1]) {
    const e = side < 0 ? eL : eR;
    for (const f of flakes) {
      const rx = f.x - e[0], ry = f.y - e[1], rz = f.z - e[2];
      const cz = rx * F[0] + ry * F[1] + rz * F[2];
      if (cz < 0.3) continue;
      const cx = rx * R[0] + ry * R[1] + rz * R[2], cy = rx * U[0] + ry * U[1] + rz * U[2];
      const k = toPixel(side, cx / cz, cy / cz);
      if (k < 0) continue;
      px32[k] = 0xfff4eee8;
      if (cz < 2.5) { if (k + 1 < n && lutS[k + 1] === side) px32[k + 1] = 0xfff4eee8; if (k + W < n && lutS[k + W] === side) px32[k + W] = 0xfff4eee8; }
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; T += dt;
  stepSnow(dt);
  render(headQ());
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- the adjust panel ---------- */
const panel = document.getElementById("panel");
const fields = { sep: v => v.toFixed(1) + "mm", vy: v => (v > 0 ? "+" : "") + v.toFixed(1) + "mm", k: v => "×" + v.toFixed(2), dist: v => v.toFixed(1), zoom: v => "×" + v.toFixed(2) };
function showVals() {
  for (const id in fields) { document.getElementById(id).value = S[id]; document.getElementById(id + "v").textContent = fields[id](S[id]); }
  for (const b of document.querySelectorAll("#modes div")) b.classList.toggle("on", b.dataset.m === S.mode);
  document.getElementById("camrow").classList.toggle("on", S.mode !== "scene");
}
for (const b of document.querySelectorAll("#modes div")) b.addEventListener("click", async () => {
  S.mode = b.dataset.m; save(); showVals();
  document.getElementById("note").textContent = "";
  if (S.mode === "scene") stopCam(); else await startCam();
});
for (const id in fields) document.getElementById(id).addEventListener("input", e => { S[id] = parseFloat(e.target.value); showVals(); build(); save(); });
document.getElementById("reset").addEventListener("click", () => { S = Object.assign({}, DEFAULTS); showVals(); build(); save(); });
showVals();

let wake = null, started = false;
async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wake) keepAwake(); });
document.getElementById("go").addEventListener("click", async () => {
  if (!started) {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== "granted") document.getElementById("note").textContent = "首の動きが許可されませんでした。指でドラッグして見回せます。";
      }
    } catch (e) {}
    addEventListener("deviceorientation", onOrient);
    keepAwake();
    if (S.mode !== "scene" && !(await startCam())) return;
    started = true;
    document.getElementById("go").textContent = "つづける";
    setTimeout(doRecenter, 400);
  }
  panel.classList.add("off");
});

/* ---------- touch: drag to look (PC / no sensor), 1 tap = adjust panel, 2 taps = recenter ---------- */
let drag = null, tapTimer = 0, lastTap = 0;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, yaw: dragYaw, pitch: dragPitch, moved: false }; });
addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (hasGyro) return;
  dragYaw = drag.yaw + (e.clientX - drag.x) * 0.005;
  dragPitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (e.clientY - drag.y) * 0.005));
});
cv.addEventListener("pointerup", () => {
  const moved = drag && drag.moved; drag = null;
  if (moved || !started) return;
  const n = performance.now();
  if (n - lastTap < 350) { clearTimeout(tapTimer); lastTap = 0; doRecenter(); return; }
  lastTap = n;
  tapTimer = setTimeout(() => panel.classList.remove("off"), 360);
});
addEventListener("pointerup", () => { drag = null; });
</script>
