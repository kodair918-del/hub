<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>VR</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; }
  #panel { z-index:4; position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(720px, 100vw); max-height:100dvh; overflow:auto; background:rgba(14,15,18,.82); color:#e8e6e1; font-family:system-ui, -apple-system, "Hiragino Sans", sans-serif; padding:12px 16px 14px; border-radius:16px 16px 0 0; box-sizing:border-box; }
  #panel.off { display:none; }
  #panel b { font-size:17px; }
  #panel .s { font-size:12px; color:#9aa0ab; line-height:1.6; margin:4px 0 8px; }
  #ctl { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:6px 14px; }
  .row { display:grid; grid-template-columns:1fr 48px 5.2em 48px; align-items:center; gap:6px; font-size:13px; }
  .row .pm { height:44px; border-radius:12px; background:#2c303b; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; touch-action:manipulation; }
  .row .pm:active { background:#7fb4ff; color:#0b0b0a; }
  .row .val { text-align:center; font-variant-numeric:tabular-nums; font-size:15px; }
  #guide { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; pointer-events:none; z-index:5; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .btns div { flex:1; text-align:center; padding:11px 0; border-radius:12px; font-weight:bold; font-size:15px; }
  #go { background:#7fb4ff; color:#0b0b0a; }
  #reset { background:#252832; flex:0 0 7em !important; font-weight:normal !important; }
  .modes { display:flex; gap:6px; margin:6px 0 8px; }
  .modes div { flex:1; text-align:center; padding:8px 0; border-radius:10px; background:#252832; font-size:13px; }
  .modes div.on { background:#7fb4ff; color:#0b0b0a; font-weight:bold; }
  #camrow { display:none; }
  #camrow.on { display:grid; }
  video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="guide"></canvas>
<video id="vid" playsinline muted autoplay></video>
<div id="panel">
  <b>夜の川辺</b>
  <div class="s">黄色い十字が、それぞれのレンズの真ん中に来るように合わせてください（押し続けると連続で動きます）。<br>ゴーグルの中で：画面を1回タップ → この調整に戻る／2回タップ → いま向いている方が正面</div>
  <div class="modes" id="modes"><div data-m="scene">夜の川辺</div><div data-m="cam">カメラ</div><div data-m="camsnow">カメラ＋雪</div></div>
  <div id="ctl"></div>
  <div class="btns"><div id="reset">元に戻す</div><div id="go">はじめる</div></div>
  <div class="s" id="note"></div>
  <div class="s" id="ver" style="text-align:right;margin:0"></div>
</div>
<script>
/* Home-screen apps keep an old copy of the page (GitHub Pages lets it be cached for 10 min, and the app
   often keeps it longer). So the page asks the server for its newest copy and, if its VERSION differs,
   loads that one. Bump VERSION on every change. */
const VERSION = "2026-11-25.6";
async function checkUpdate() {
  try {
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const VERSION = "([^"]+)"/);
    if (!m || m[1] === VERSION) return;
    const key = "reloaded-" + m[1];
    if (sessionStorage.getItem(key)) return;      // already tried once: don't loop
    sessionStorage.setItem(key, "1");
    location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
  } catch (e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !window.started) checkUpdate(); });
</script>
<script>
"use strict";
/* ---------- settings (tunable) ---------- */
const RENDER_SCALE = 2;     // canvas pixels per CSS pixel (iPhone screens are 3; 2 is sharp and keeps the GPU cool)
const PX_PER_MM = 6.04;     // CSS pixels per millimetre on the phone screen (recent iPhones: 460 ppi / 3)
const IPD = 0.064;          // distance between the eyes in the scene, metres (depth of the snow)
const EYE_HEIGHT = 1.6;     // how high the eyes are above the snow
const SNOW_N = 450;         // snowflakes
const FLAKE = 0.05;         // snowflake size, metres
const K1 = 0.34, K2 = 0.55; // lens distortion (Cardboard's usual values), scaled by the "ゆがみ補正" slider
const MAX_TAN = 1.25;       // beyond this angle from the lens centre, draw black
const CAM_TAN_H = Math.tan(34 * Math.PI / 180);   // half of the 1x camera's horizontal view (about 68 deg across)
// sep: lens spacing (mm), vy: lens centre up/down (mm), k: distortion scale, dist: screen-to-lens (mm),
// zoom: camera picture size (1 = true size), mode: scene | cam | camsnow
const DEFAULTS = { sep: 60, vy: 0, k: 1, dist: 39, zoom: 1, mode: "scene" };
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem("vrcfg") || "{}")); } catch (e) {}
function save() { try { localStorage.setItem("vrcfg", JSON.stringify(S)); } catch (e) {} }

/* ---------- small math ---------- */
const PI = Math.PI;
function qMul(a, b) {
  return [a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
          a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
          a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
          a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
}
function qAxis(x, y, z, ang) { const s = Math.sin(ang/2); return [x*s, y*s, z*s, Math.cos(ang/2)]; }
function qRot(q, x, y, z) {
  const [qx, qy, qz, qw] = q;
  const ix = qw*x + qy*z - qz*y, iy = qw*y + qz*x - qx*z, iz = qw*z + qx*y - qy*x, iw = -qx*x - qy*y - qz*z;
  return [ix*qw + iw*-qx + iy*-qz - iz*-qy, iy*qw + iw*-qy + iz*-qx - ix*-qz, iz*qw + iw*-qz + ix*-qy - iy*-qx];
}

/* ---------- head orientation ---------- */
let devQ = null, hasGyro = false;
let recenter = [0, 0, 0, 1];
let dragYaw = 0, dragPitch = 0;
const Q_BACK = [-Math.SQRT1_2, 0, 0, Math.SQRT1_2];   // -90 deg about X: the camera looks out of the back of the phone
function onOrient(e) {
  if (e.alpha == null) return;
  hasGyro = true;
  const d = PI / 180, x = e.beta * d, y = e.alpha * d, z = -e.gamma * d;
  const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2), s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
  let q = [s1*c2*c3 + c1*s2*s3, c1*s2*c3 - s1*c2*s3, c1*c2*s3 - s1*s2*c3, c1*c2*c3 + s1*s2*s3];   // Euler YXZ
  q = qMul(q, Q_BACK);
  const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * d;
  devQ = qMul(q, qAxis(0, 0, 1, -ang));
}
function headQ() {
  if (hasGyro && devQ) return qMul(recenter, devQ);
  return qMul(qAxis(0, 1, 0, dragYaw), qAxis(1, 0, 0, dragPitch));
}
function doRecenter() {
  if (!devQ) { dragYaw = 0; dragPitch = 0; return; }
  const f = qRot(devQ, 0, 0, -1);
  recenter = qAxis(0, 1, 0, -Math.atan2(-f[0], -f[2]));
}

/* ---------- GPU drawing ----------
   Every screen pixel is measured (in mm) from its lens centre. The lens bends it outward
   (r_screen = r * (1 + k1 r^2 + k2 r^4)), so the shader undoes that to find the true angle and draws
   what lies there: the night scene, or the camera picture. Through the lens it looks straight again. */
const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) document.getElementById("note").textContent = "この端末では描けませんでした（WebGL2 が使えません）。";

const VS_FULL = `#version 300 es
in vec2 aP; void main() { gl_Position = vec4(aP, 0.0, 1.0); }`;

const FS_MAIN = `#version 300 es
precision highp float;
uniform vec2 uRes, uMm, uCamTan;
uniform float uSep, uVy, uDist, uK1, uK2, uMaxTan, uOff, uT, uEyeH, uCamOk;
uniform vec3 uR, uU, uF;
uniform int uMode;
uniform sampler2D uCam;
out vec4 o;
const float PI = 3.14159265, DEG = PI / 180.0;

float h3(vec3 p) {
  uvec3 v = uvec3(ivec3(floor(p)) + 1000000);
  uint h = v.x * 374761393u + v.y * 668265263u + v.z * 2246822519u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  h ^= h >> 16u;
  return float(h) / 4294967296.0;
}
float farH(float a) { return (6.5 + 3.0*sin(3.0*a + 1.0) + 2.0*sin(7.0*a + 2.0) + 0.8*sin(17.0*a)) * DEG; }
float nearH(float a) { return (2.8 + 2.2*sin(5.0*a + 4.0) + 1.3*sin(11.0*a + 1.0) + 0.5*sin(29.0*a)) * DEG; }

vec3 sky(vec3 d) {
  float el = asin(clamp(d.y, -1.0, 1.0));
  float az = atan(d.x, -d.z);
  float hn = nearH(az);
  if (el < hn) return el < 0.0 ? vec3(20, 26, 48) : vec3(13, 17, 30);
  float hf = farH(az);
  if (el < hf) return (hf > 9.0*DEG && el > hf - 1.3*DEG) ? vec3(120, 132, 165) : vec3(26, 32, 56);
  float k = clamp(el / (PI * 0.5), 0.0, 1.0);
  vec3 c = vec3(24.0 - 18.0*k, 32.0 - 24.0*k, 64.0 - 40.0*k);
  vec3 moon = normalize(vec3(0.45, 0.42, -0.79));
  float m = dot(d, moon);
  float mc = cos(2.4*DEG), gc = cos(9.0*DEG);
  if (m > mc) {
    // a little shading on the moon so it is not a flat disc
    float e = (m - mc) / (1.0 - mc);
    return mix(vec3(214, 206, 170), vec3(240, 234, 204), smoothstep(0.0, 0.5, e));
  }
  if (m > gc) { float g = (m - gc) / (mc - gc); c += vec3(40, 40, 46) * g * g; }
  // stars: a fine grid on the sphere, a few cells lit, each twinkling at its own pace, drawn as soft dots
  float N = 420.0;
  vec3 q = (d + 1.0) * N, cell = floor(q);
  float h = h3(cell);
  if (h < 0.0045 + 0.004 * k) {
    vec3 f = q - cell - 0.5;
    float dot_ = 1.0 - smoothstep(0.15, 0.5, length(f));
    float br = 0.55 + 0.45 * sin(uT * (1.0 + h * 400.0) + h3(cell.zxy) * 6.283);
    float s = (150.0 + 105.0 * h3(cell.yzx)) * br * dot_;
    c = max(c, vec3(s, s, s * 1.05));
  }
  return c;
}

float riverZ(float x) { return -9.0 + 2.2*sin(x*0.045 + 0.6) + 0.8*sin(x*0.13); }

vec3 shade(vec3 e, vec3 d) {
  if (d.y >= -0.002) return sky(d);
  float t = min((e.y + uEyeH) / -d.y, 4000.0);
  float px = e.x + d.x * t, pz = e.z + d.z * t;
  float fog = 1.0 - exp(-t / 70.0);
  float dist = abs(pz - riverZ(px));
  vec3 c;
  const float RH = 2.6;
  if (dist < RH) {
    float wob = 0.018*sin(px*1.7 + uT*1.6) + 0.012*sin(pz*2.3 - uT*1.1);
    vec3 s = sky(normalize(vec3(d.x + wob, -d.y, d.z)));
    c = s * vec3(0.55, 0.6, 0.7) + vec3(4, 8, 16);
    if (h3(vec3(floor(px*3.0 - uT*4.0), floor(pz*6.0), 7.0)) > 0.985) c += vec3(40, 46, 60);
  } else if (dist < RH + 0.35) {
    c = vec3(30, 34, 44);
  } else {
    float n = (h3(vec3(floor(px*5.0), floor(pz*5.0), 3.0)) - 0.5) * 8.0;
    c = vec3(118, 128, 158) + n;
  }
  return mix(c, vec3(20, 26, 48), fog);
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  float xm = fc.x / uRes.x * uMm.x, ym = (uRes.y - fc.y) / uRes.y * uMm.y;
  float side = xm < uMm.x * 0.5 ? -1.0 : 1.0;
  float lx = uMm.x * 0.5 + side * uSep * 0.5, ly = uMm.y * 0.5 - uVy;
  vec2 ts = vec2(xm - lx, ly - ym) / uDist;
  float rs = length(ts), r = rs;
  for (int i = 0; i < 8; i++) {
    float r2 = r * r;
    r -= (r * (1.0 + uK1*r2 + uK2*r2*r2) - rs) / (1.0 + 3.0*uK1*r2 + 5.0*uK2*r2*r2);
  }
  if (r > uMaxTan || !(r >= 0.0)) { o = vec4(0, 0, 0, 1); return; }
  vec2 tu = rs > 0.0 ? ts * (r / rs) : ts;
  if (uMode == 1) {
    vec2 uv = vec2(0.5 + tu.x / (2.0 * uCamTan.x), 0.5 - tu.y / (2.0 * uCamTan.y));
    if (uCamOk < 0.5 || uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) { o = vec4(0, 0, 0, 1); return; }
    o = vec4(texture(uCam, uv).rgb, 1.0);
    return;
  }
  vec3 dir = normalize(uF + uR * tu.x + uU * tu.y);
  vec3 c = shade(uR * side * uOff, dir);
  o = vec4(min(c, 255.0) / 255.0, 1.0);
}`;

// snowflakes: each one is projected for each eye and pushed outward the way the lens pulls it in
const VS_SNOW = `#version 300 es
in vec3 aP;
uniform vec2 uMm;
uniform float uSep, uVy, uDist, uK1, uK2, uOff, uSide, uPxMm, uFlake, uMaxTan;
uniform vec3 uR, uU, uF;
out float vA;
void main() {
  gl_Position = vec4(2.0, 2.0, 0.0, 1.0); gl_PointSize = 0.0; vA = 0.0;
  vec3 rel = aP - uR * uSide * uOff;
  float cz = dot(rel, uF);
  if (cz < 0.3) return;
  vec2 t = vec2(dot(rel, uR), dot(rel, uU)) / cz;
  float r2 = dot(t, t);
  if (r2 > uMaxTan * uMaxTan) return;
  float f = 1.0 + uK1*r2 + uK2*r2*r2;
  float lx = uMm.x * 0.5 + uSide * uSep * 0.5, ly = uMm.y * 0.5 - uVy;
  float xm = lx + t.x * f * uDist, ym = ly - t.y * f * uDist;
  if ((uSide < 0.0 && xm > uMm.x * 0.5) || (uSide > 0.0 && xm < uMm.x * 0.5)) return;
  gl_Position = vec4(xm / uMm.x * 2.0 - 1.0, 1.0 - ym / uMm.y * 2.0, 0.0, 1.0);
  float px = uFlake / cz * f * uDist * uPxMm;
  gl_PointSize = clamp(px, 2.5, 32.0);
  vA = clamp(px / 2.5, 0.45, 0.9);
}`;
const FS_SNOW = `#version 300 es
precision mediump float;
in float vA; out vec4 o;
void main() { float a = 1.0 - smoothstep(0.2, 0.5, length(gl_PointCoord - 0.5)); o = vec4(0.96, 0.94, 0.91, a * vA); }`;

function prog(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
const P = prog(VS_FULL, FS_MAIN), PS = prog(VS_SNOW, FS_SNOW);
const vaoFull = gl.createVertexArray(); gl.bindVertexArray(vaoFull);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindAttribLocation(P.p, 0, "aP");

const snowPos = new Float32Array(SNOW_N * 3);
const vaoSnow = gl.createVertexArray(); gl.bindVertexArray(vaoSnow);
const snowBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, snowBuf);
gl.bufferData(gl.ARRAY_BUFFER, snowPos.byteLength, gl.DYNAMIC_DRAW);
const snowLoc = gl.getAttribLocation(PS.p, "aP");
gl.enableVertexAttribArray(snowLoc); gl.vertexAttribPointer(snowLoc, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const camTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, camTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));

let mmW = 0, mmH = 0;
function resize() {
  const sc = Math.min(RENDER_SCALE, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * sc); cv.height = Math.round(innerHeight * sc);
  mmW = innerWidth / PX_PER_MM; mmH = innerHeight / PX_PER_MM;
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", resize);
resize();

/* ---------- snow ---------- */
const flakes = [];
function rnd(a, b) { return a + Math.random() * (b - a); }
for (let i = 0; i < SNOW_N; i++) flakes.push({ x: rnd(-14, 14), y: rnd(-EYE_HEIGHT, 9), z: rnd(-14, 14), v: rnd(0.5, 1.1), p: rnd(0, 6.28) });
let T = 0;
function stepSnow(dt) {
  flakes.forEach((f, i) => {
    f.y -= f.v * dt;
    f.x += Math.sin(T * 0.7 + f.p) * 0.25 * dt;
    if (f.y < -EYE_HEIGHT) { f.y = 9; f.x = rnd(-14, 14); f.z = rnd(-14, 14); }
    snowPos[i * 3] = f.x; snowPos[i * 3 + 1] = f.y; snowPos[i * 3 + 2] = f.z;
  });
}

/* ---------- the camera ---------- */
const vid = document.getElementById("vid");
let camOn = false;
async function startCam() {
  if (camOn) return true;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    vid.srcObject = st; await vid.play(); camOn = true; return true;
  } catch (e) {
    document.getElementById("note").textContent = "カメラが使えませんでした（" + (e.name || e) + "）。設定 → Safari → カメラ を「許可」にしてください。";
    return false;
  }
}
function stopCam() {
  if (!camOn) return;
  for (const t of vid.srcObject.getTracks()) t.stop();
  vid.srcObject = null; camOn = false;
}

/* ---------- each frame ---------- */
function setLens(u) {
  gl.uniform2f(u.uMm, mmW, mmH);
  gl.uniform1f(u.uSep, S.sep); gl.uniform1f(u.uVy, S.vy); gl.uniform1f(u.uDist, S.dist);
  gl.uniform1f(u.uK1, K1 * S.k); gl.uniform1f(u.uK2, K2 * S.k);
  gl.uniform1f(u.uMaxTan, MAX_TAN); gl.uniform1f(u.uOff, IPD / 2);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; T += dt;
  const q = headQ();
  const R = qRot(q, 1, 0, 0), U = qRot(q, 0, 1, 0), F = qRot(q, 0, 0, -1);
  const cam = S.mode !== "scene";
  let camOk = 0;
  if (cam && camOn && vid.readyState >= 2 && vid.videoWidth) {
    gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, vid);
    camOk = 1;
  }
  gl.disable(gl.BLEND);
  gl.useProgram(P.p); const u = P.u;
  setLens(u);
  gl.uniform2f(u.uRes, cv.width, cv.height);
  gl.uniform3f(u.uR, ...R); gl.uniform3f(u.uU, ...U); gl.uniform3f(u.uF, ...F);
  gl.uniform1f(u.uT, T); gl.uniform1f(u.uEyeH, EYE_HEIGHT);
  gl.uniform1i(u.uMode, cam ? 1 : 0); gl.uniform1f(u.uCamOk, camOk);
  const th = CAM_TAN_H / S.zoom, tv = th * (vid.videoHeight || 3) / (vid.videoWidth || 4);
  gl.uniform2f(u.uCamTan, th, tv);
  gl.uniform1i(u.uCam, 0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, camTex);
  gl.bindVertexArray(vaoFull); gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (S.mode !== "cam") {
    stepSnow(dt);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PS.p); const v = PS.u;
    setLens(v);
    gl.uniform3f(v.uR, ...R); gl.uniform3f(v.uU, ...U); gl.uniform3f(v.uF, ...F);
    gl.uniform1f(v.uPxMm, cv.width / mmW); gl.uniform1f(v.uFlake, FLAKE);
    gl.bindVertexArray(vaoSnow);
    gl.bindBuffer(gl.ARRAY_BUFFER, snowBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, snowPos);
    for (const side of [-1, 1]) { gl.uniform1f(v.uSide, side); gl.drawArrays(gl.POINTS, 0, SNOW_N); }
  }
  gl.bindVertexArray(null);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- the adjust panel ---------- */
const panel = document.getElementById("panel");
// the controls: name, step per press, limits, how the value is shown
const CTL = [
  { id: "zoom", nm: "カメラの大きさ", step: 0.05, min: 0.6, max: 1.6, fmt: v => "×" + v.toFixed(2), cam: true },
  { id: "sep",  nm: "レンズの間隔",   step: 0.5,  min: 50,  max: 75,  fmt: v => v.toFixed(1) + "mm" },
  { id: "vy",   nm: "上下の位置",     step: 0.5,  min: -15, max: 15,  fmt: v => (v > 0 ? "+" : "") + v.toFixed(1) + "mm" },
  { id: "k",    nm: "ゆがみ補正",     step: 0.05, min: 0,   max: 2,   fmt: v => "×" + v.toFixed(2) },
  { id: "dist", nm: "見える広さ",     step: 0.5,  min: 30,  max: 50,  fmt: v => v.toFixed(1) },
];
const ctlBox = document.getElementById("ctl");
for (const c of CTL) {
  const row = document.createElement("div"); row.className = "row"; row.id = "row-" + c.id;
  row.innerHTML = '<span></span><div class="pm">−</div><span class="val"></span><div class="pm">＋</div>';
  row.firstChild.textContent = c.nm;
  const [minus, , plus] = [row.children[1], row.children[2], row.children[3]];
  const bump = dir => {
    S[c.id] = Math.round(Math.min(c.max, Math.max(c.min, S[c.id] + dir * c.step)) / c.step) * c.step;
    showVals(); save();
  };
  // one press = one step; holding repeats after 0.4 s, every 0.08 s
  for (const [b, dir] of [[minus, -1], [plus, 1]]) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener("pointerdown", e => { e.preventDefault(); bump(dir); stop(); t1 = setTimeout(() => { t2 = setInterval(() => bump(dir), 80); }, 400); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, stop);
  }
  ctlBox.appendChild(row);
}
function showVals() {
  for (const c of CTL) {
    document.querySelector("#row-" + c.id + " .val").textContent = c.fmt(S[c.id]);
    document.getElementById("row-" + c.id).style.display = c.cam && S.mode === "scene" ? "none" : "";
  }
  for (const b of document.querySelectorAll("#modes div")) b.classList.toggle("on", b.dataset.m === S.mode);
  drawGuide();
}

/* yellow crosses on each lens centre while the panel is open, so the spacing can be judged without the goggles */
const gcv = document.getElementById("guide"), gctx = gcv.getContext("2d");
function drawGuide() {
  const dpr = devicePixelRatio || 1;
  gcv.width = Math.round(innerWidth * dpr); gcv.height = Math.round(innerHeight * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, innerWidth, innerHeight);
  if (document.getElementById("panel").classList.contains("off")) return;
  const mm = PX_PER_MM, cy = innerHeight / 2 - S.vy * mm;
  gctx.strokeStyle = "#ffd84a"; gctx.lineWidth = 2;
  for (const side of [-1, 1]) {
    const cx = innerWidth / 2 + side * S.sep / 2 * mm;
    gctx.beginPath();
    gctx.moveTo(cx - 12 * mm, cy); gctx.lineTo(cx + 12 * mm, cy);
    gctx.moveTo(cx, cy - 12 * mm); gctx.lineTo(cx, cy + 12 * mm);
    gctx.stroke();
    gctx.beginPath(); gctx.arc(cx, cy, 8 * mm, 0, 2 * Math.PI); gctx.stroke();
  }
  gctx.strokeStyle = "rgba(255,255,255,.35)"; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.moveTo(innerWidth / 2, 0); gctx.lineTo(innerWidth / 2, innerHeight); gctx.stroke();
}
addEventListener("resize", drawGuide);
for (const b of document.querySelectorAll("#modes div")) b.addEventListener("click", async () => {
  S.mode = b.dataset.m; save(); showVals();
  document.getElementById("note").textContent = "";
  if (S.mode === "scene") stopCam(); else await startCam();
});
document.getElementById("reset").addEventListener("click", () => { const m = S.mode; S = Object.assign({}, DEFAULTS, { mode: m }); showVals(); save(); });
showVals();

let wake = null;
window.started = false;
document.getElementById("ver").textContent = "版 " + VERSION;
async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wake) keepAwake(); });
document.getElementById("go").addEventListener("click", async () => {
  if (!window.started) {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== "granted") document.getElementById("note").textContent = "首の動きが許可されませんでした。指でドラッグして見回せます。";
      }
    } catch (e) {}
    addEventListener("deviceorientation", onOrient);
    keepAwake();
    if (S.mode !== "scene" && !(await startCam())) return;
    window.started = true;
    document.getElementById("go").textContent = "つづける";
    setTimeout(doRecenter, 400);
  }
  panel.classList.add("off");
  drawGuide();
});

/* ---------- touch: drag to look (PC / no sensor), 1 tap = adjust panel, 2 taps = recenter ---------- */
let drag = null, tapTimer = 0, lastTap = 0;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, yaw: dragYaw, pitch: dragPitch, moved: false }; });
addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (hasGyro) return;
  dragYaw = drag.yaw + (e.clientX - drag.x) * 0.005;
  dragPitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (e.clientY - drag.y) * 0.005));
});
cv.addEventListener("pointerup", () => {
  const moved = drag && drag.moved; drag = null;
  if (moved || !window.started) return;
  const n = performance.now();
  if (n - lastTap < 350) { clearTimeout(tapTimer); lastTap = 0; doRecenter(); return; }
  lastTap = n;
  tapTimer = setTimeout(() => { panel.classList.remove("off"); drawGuide(); }, 360);
});
addEventListener("pointerup", () => { drag = null; });
</script>
</body>
